name: vision-benchmark

on:
  workflow_dispatch:
  push:
    paths: ["bench/config/models.yaml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -U pip
      - run: pip install datasets psycopg2-binary Pillow
      - run: python bench/init_db.py
      - run: python -m bench.status start
      - run: python -m bench.status stage INIT "" running
      - run: python bench/prepare.py
      - run: python -m bench.status stage DATASET "" done "100 images sampled"
      - uses: actions/upload-artifact@v4
        with: { name: sample, path: data/sample }

  eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: microsoft/resnet-50,          task: image-classification, slug: resnet-50 }
          - { model: google/vit-base-patch16-224,  task: image-classification, slug: vit-base }
          - { model: facebook/detr-resnet-50,      task: object-detection,     slug: detr-resnet-50 }
          - { model: hustvl/yolos-small,           task: object-detection,     slug: yolos-small }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r bench/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: sample, path: data/sample }
      - run: python -m bench.status stage EVAL "${{ matrix.slug }}" running "${{ matrix.model }}"
      - run: python bench/run_model.py --model "${{ matrix.model }}" --task "${{ matrix.task }}" --slug "${{ matrix.slug }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.slug }}", path: out/ }

  publish:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SPACE_URL: ${{ vars.SPACE_URL }}
      PAGES_URL: ${{ vars.PAGES_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install psycopg2-binary
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out/, merge-multiple: true }
      - run: python -m bench.status stage METRICS "" running
      - run: python bench/aggregate.py
      - run: python -m bench.status stage METRICS "" done
      - run: python -m bench.status stage ARTIFACTS "" running
      - run: python bench/publish.py
      - run: python -m bench.status stage ARTIFACTS "" done
      - run: python -m bench.status stage PUBLISH "" running
      - run: python bench/site/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
      - run: python -m bench.status stage PUBLISH "" done
      - run: python bench/notify.py
      - run: python -m bench.status stage NOTIFY "" done
