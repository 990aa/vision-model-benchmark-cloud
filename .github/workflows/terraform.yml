name: "Terraform Infrastructure"

on:
  # Triggers automatically as soon as the Vision Benchmark workflow starts
  workflow_run:
    workflows: ["Vision Model Benchmark"] # <-- MUST MATCH your benchmark workflow's name
    types:
      - requested

  # Kept so you can still test it manually with the "Run workflow" button
  workflow_dispatch:
    inputs:
      auto_apply:
        description: "Apply Terraform changes (default: false - plan only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_repo: ${{ github.event.repository.name }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Formatting
        run: |
          terraform fmt -check || echo "Formatting differences checked"

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color

      - name: Terraform Apply
        if: ${{ inputs.auto_apply == true }}
        run: |
          terraform apply -auto-approve
